# Default values for mongodb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: mongo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "7"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # NodePort, not the nginx-wan Ingress below -- MongoDB is raw TCP, not HTTP,
  # so an Ingress can't carry it (same reason as RabbitMQ's AMQP port). Reaching
  # it via nginx-wan at all would need that controller's tcp-services ConfigMap
  # patched, which your kubectl identity doesn't have RBAC to touch (confirmed:
  # its namespace isn't in your `auth can-i --list`). NodePort works with no
  # extra cluster infra -- connect via <any-node-IP>:<nodeport from `kubectl
  # get svc`>.
  type: NodePort
  port: 27017

# auth is REQUIRED now that this is publicly reachable -- an open,
# unauthenticated Mongo on the public internet gets found and wiped by bots
# within minutes.
auth:
  enabled: true
  rootUsername: root
  rootPassword: "tmt123123@"
  database: StableDiffusion

# Left disabled: an Ingress can't route Mongo's raw wire protocol (see
# service.type comment above), so enabling this doesn't make Mongo reachable
# -- it would just add a dead HTTP path in front of a non-HTTP service. Kept
# here, off, in case someone with RBAC on the nginx-wan namespace patches its
# tcp-services ConfigMap later; nothing above needs to change if they do.
ingress:
  enabled: false
  className: nginx-wan
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
  hosts:
    - host: mongodb-image-gen.ai.public.rke.app.dev.tmtco.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: mongodb-image-gen-tls
      hosts:
        - mongodb-image-gen.ai.public.rke.app.dev.tmtco.org

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - mongodb.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# MongoDB has no HTTP endpoint to httpGet-probe; tcpSocket just checks the
# port accepts connections.
livenessProbe:
  tcpSocket:
    port: mongodb
  initialDelaySeconds: 10
  periodSeconds: 20
readinessProbe:
  tcpSocket:
    port: mongodb
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Data directory persistence. A single-replica Deployment + PVC is enough for
# dev/demo use (matches this repo's other datastores); go to a StatefulSet +
# replica set only if you actually need MongoDB HA.
persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: longhorn
  mountPath: /data/db

# Extra volumes/volumeMounts beyond the persistence one above.
volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
